# Opt-in integration with the sibling lab-server processing-components checkout.
# CARGO_TARGET_DIR must point at the existing shared build directory.
# cargo test --manifest-path tests/server_contract/Cargo.toml
# All transports are in memory; TOML startup tests inject an opener and never open serial ports.
[package]
name = "lab-plot-server-contract"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
lab-plot = { path = "../.." }
lab-server = { path = "../../../lab-server" }

serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
